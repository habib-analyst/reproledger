[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reproledger"
version = "0.1.0"
description = "The reproducibility attestation network: publish repro recipes, verify them anywhere, earn 'reproduced by N independent parties' badges."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Habib Ur Rehman", email = "habib-analyst@users.noreply.github.com" }]
keywords = ["reproducibility", "attestation", "mlops", "benchmarking", "open-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/habib-analyst/reproledger"
Repository = "https://github.com/habib-analyst/reproledger"
Paper = "https://github.com/habib-analyst/reproledger/blob/main/docs/PAPER.md"

[project.scripts]
repro = "repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
